<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TasteMap is offline</title>
    <style>
      :root {
        color: #1c1917;
        background: #fff8e8;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        display: grid;
        gap: 14px;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.86);
        padding: 24px;
        box-shadow: 0 18px 48px rgba(28, 25, 23, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #57534e;
        line-height: 1.6;
      }

      a {
        color: #047857;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TasteMap is offline</h1>
      <p>
        Your network is unavailable right now. Reconnect and reopen TasteMap to
        sync private restaurant cards and friend activity.
      </p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
